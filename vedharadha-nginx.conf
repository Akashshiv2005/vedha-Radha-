##############################################################################
# Nginx Configuration for Vedha Radha Thangamaaligai
# File: /etc/nginx/sites-available/vedharadha.risingsuntech.in
#
# Setup:
#   sudo cp vedharadha-nginx.conf /etc/nginx/sites-available/vedharadha.risingsuntech.in
#   sudo ln -s /etc/nginx/sites-available/vedharadha.risingsuntech.in /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
##############################################################################

server {
    listen 80;
    server_name vedharadha.risingsuntech.in;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name vedharadha.risingsuntech.in;

    # SSL Certificates (Cloudflare / Let's Encrypt)
    # If using Cloudflare in Full (Strict) mode, use the Cloudflare Origin Certificate here
    ssl_certificate     /etc/ssl/vedharadha/fullchain.pem;
    ssl_certificate_key /etc/ssl/vedharadha/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript;
    gzip_min_length 1024;

    # ── API Routes: Proxy to Node.js Express server ──────────────────────────
    # THIS IS THE CRITICAL BLOCK — all /api/* must go to Node, NOT to static files
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Required headers
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Allow POST and other methods
        proxy_method       $request_method;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;

        # Do NOT cache API responses at Nginx level
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # ── Static Assets from dist/ (served by Node/Express, or directly) ───────
    # Option A: Let Node.js serve everything (simplest, recommended)
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # Logging
    access_log /var/log/nginx/vedharadha-access.log;
    error_log  /var/log/nginx/vedharadha-error.log;
}
