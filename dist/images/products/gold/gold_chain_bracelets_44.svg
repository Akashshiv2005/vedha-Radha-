cle cx="-176.54135047258146" cy="-17.55812898145158" r="6.5" fill="url(#goldSphere)"/><circle cx="-180" cy="-1.6532731788489267e-14" r="6.5" fill="url(#goldSphere)"/><circle cx="-176.54135047258148" cy="17.558128981451546" r="6.5" fill="url(#goldSphere)"/><circle cx="-166.2983158520316" cy="34.4415089128581" r="6.5" fill="url(#goldSphere)"/><circle cx="-149.66453021445818" cy="50.001320971764166" r="6.5" fill="url(#goldSphere)"/><circle cx="-127.27922061357859" cy="63.63961030678926" r="6.5" fill="url(#goldSphere)"/><circle cx="-100.00264194352839" cy="74.83226510722908" r="6.5" fill="url(#goldSphere)"/><circle cx="-68.88301782571627" cy="83.14915792601579" r="6.5" fill="url(#goldSphere)"/><circle cx="-35.11625796290317" cy="88.27067523629073" r="6.5" fill="url(#goldSphere)"/>
          <g transform="translate(0, 90)">
            <circle cx="0" cy="0" r="28" fill="url(#goldHighlight)" stroke="#5C3B04" stroke-width="2"/>
            <circle cx="0" cy="0" r="14" fill="url(#gemEmerald)"/>
          </g>
        </g>
      
  </g>
</svg>