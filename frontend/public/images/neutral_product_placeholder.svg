<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2" />
      <stop offset="50%" stop-color="#F5EFE6" />
      <stop offset="100%" stop-color="#EFE7DA" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C59E4E" />
      <stop offset="50%" stop-color="#8D6725" />
      <stop offset="100%" stop-color="#581923" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#FAF7F2" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#EFE7DA" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" fill="url(#bgGrad)" />
  <circle cx="200" cy="180" r="140" fill="url(#glowGrad)" />

  <!-- Subtle Outer Border -->
  <rect x="12" y="12" width="376" height="376" rx="16" fill="none" stroke="#E3D7C5" stroke-width="1.5" stroke-dasharray="4 4" />
  <rect x="20" y="20" width="360" height="360" rx="12" fill="none" stroke="#EDE4D6" stroke-width="1" />

  <!-- Elegant Jewellery Motif (Pendant / Gem Silhouette) -->
  <g transform="translate(200, 175)" stroke="url(#goldGrad)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Hanging Ring / Bail -->
    <circle cx="0" cy="-75" r="9" stroke-width="2.5" />
    <circle cx="0" cy="-75" r="4.5" stroke-width="1.5" />

    <!-- Central Diamond / Lotus Contour -->
    <path d="M 0 -62 C 22 -40, 50 -15, 50 15 C 50 45, 28 65, 0 80 C -28 65, -50 45, -50 15 C -50 -15, -22 -40, 0 -62 Z" stroke-width="2.5" fill="#FAF6EE" fill-opacity="0.6" />

    <!-- Inner Filigree Sacred Lotus Petals -->
    <path d="M 0 -45 C 14 -28, 32 -10, 32 12 C 32 32, 18 46, 0 58 C -18 46, -32 32, -32 12 C -32 -10, -14 -28, 0 -45 Z" stroke-width="1.5" />
    <path d="M 0 -25 C 8 -12, 18 0, 18 14 C 18 26, 10 35, 0 42 C -10 35, -18 26, -18 14 C -18 0, -8 -12, 0 -25 Z" stroke-width="1" />

    <!-- Center Gem Facet -->
    <polygon points="0,-6 10,8 0,22 -10,8" stroke-width="1.5" fill="#C59E4E" fill-opacity="0.35" />

    <!-- Auspicious Droplet Accent -->
    <circle cx="0" cy="94" r="5" stroke-width="2" fill="#8D6725" />
    <path d="M 0 80 L 0 89" stroke-width="2" />
  </g>

  <!-- Typography -->
  <text x="200" y="318" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="15" font-weight="700" letter-spacing="4" fill="#581923">
    VEDHA RADHA
  </text>
  <text x="200" y="338" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="10.5" font-weight="500" letter-spacing="2" fill="#7A6E65">
    SHOWROOM CATALOGUE
  </text>
</svg>
